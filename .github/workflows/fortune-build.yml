name: ForTune Hiby build

# Same toolchain path as MusicDownloader Compás sessions (daily-build.yml),
# but with FORTUNE_SHELL=1 for the lean ForTune player.
on:
  workflow_dispatch:
  push:
    branches: [fortune-hiby, 'fortune/**']

permissions:
  contents: read

concurrency:
  group: fortune-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ForTune ${{ matrix.board }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: [r3ii_2025]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake git patch python3 curl xz-utils pkg-config libsdl2-dev file
      - name: Install verified MIPS musl toolchain
        run: |
          toolchain_dir="$(scripts/tools/toolchain/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"
      - name: Build ForTune player
        id: outputs
        run: |
          set -euo pipefail
          board='${{ matrix.board }}'
          suffix="_$board"
          if [ "$board" = r1 ]; then suffix=; fi
          make -j2 target BOARD="$board" FORTUNE_SHELL=1
          player="compas_player_target$suffix"
          test -s "$player"
          file "$player"
          mipsel-linux-musl-readelf -h "$player" | grep 'Machine:.*MIPS' >/dev/null
          echo "player=$player" >> "$GITHUB_OUTPUT"
      - name: Upload ForTune executable
        uses: actions/upload-artifact@v4
        with:
          name: fortune-player-${{ matrix.board }}
          if-no-files-found: error
          path: ${{ steps.outputs.outputs.player }}
